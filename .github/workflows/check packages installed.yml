name: Node.js Dependency Installation and Display

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.11.0"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Display Installed Dependencies
        run: |
          echo "Installed dependencies and their transitive dependencies:"
          npm ls --all --long #--depth=10 # Adjust the depth for more or fewer dependencies
